<body>

<!-- vrstva: pozadí (sdílí ho zámek i plocha) -->
<div id="wallpaper" class="wallpaper"></div>
<div id="wallpaper-dim" class="wallpaper-dim"></div>

<!-- vrstva: plocha -->
<div id="desktop" class="desktop hidden">
  <div id="icons" class="icon-layer"></div>
  <div id="widgety" class="widget-layer"></div>
  <div id="band" class="select-band hidden"></div>
  <div id="windows" class="window-layer"></div>
  <div id="taskbar-root"></div>
</div>

<!-- vrstva: zámek / přihlášení -->
<div id="lock" class="lock hidden"></div>

<!-- vrstva: boot -->
<div id="boot" class="boot"></div>

<!-- vrstva: overlaye (kontextová menu, panely, toasty) -->
<div id="overlay" class="overlay-layer"></div>
<div id="toasts" class="toast-layer"></div>
<div id="fader" class="fader"></div>

<!-- ukázková verze: anglicky schválně, autorská práva musí pochopit každý (css/demo.css) -->
